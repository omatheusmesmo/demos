# OCI: on real OCI only the region and the ~/.oci/config profile are needed.
oci.region=us-ashburn-1
oci.auth.mode=config-file

# Dev and test talk to floci-oci and sign with a key generated at startup.
%dev,test.oci.endpoint=http://localhost:4599
%dev,test.oci.auth.mode=throwaway-key
%dev,test.oci.auth.tenancy-id=ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000
%dev,test.oci.auth.user-id=ocid1.user.oc1..flocidemouser00000000000000000000000000000000000000000000000

# The OCI resources of the orders service. `make provision` writes them to .env from the Terraform outputs;
# the test resource sets them after provisioning floci-oci itself.
orders.receipts.namespace=${ORDERS_RECEIPTS_NAMESPACE}
orders.receipts.bucket=${ORDERS_RECEIPTS_BUCKET}
orders.events.queue-id=${ORDERS_EVENTS_QUEUE_ID}
orders.events.messages-endpoint=${ORDERS_EVENTS_MESSAGES_ENDPOINT}
orders.cards.key-id=${ORDERS_CARDS_KEY_ID}
orders.cards.crypto-endpoint=${ORDERS_CARDS_CRYPTO_ENDPOINT}

# Oracle Database: Dev Services start Oracle Database Free in dev and test. floci-oci has no Oracle Database service.
quarkus.datasource.db-kind=oracle
%dev,test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Oracle Database Free needs about a minute on a quiet machine; leave room on a busy laptop or CI runner.
%dev,test.quarkus.devservices.timeout=5M
