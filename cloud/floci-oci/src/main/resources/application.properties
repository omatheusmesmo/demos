# OCI: on real OCI only the region and the ~/.oci/config profile are needed.
oci.region=us-ashburn-1
oci.auth.mode=config-file

# Dev and test talk to floci-oci and sign with a key generated at startup.
%dev,test.oci.endpoint=http://localhost:4599
%dev,test.oci.auth.mode=throwaway-key
%dev,test.oci.auth.tenancy-id=ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000
%dev,test.oci.auth.user-id=ocid1.user.oc1..flocidemouser00000000000000000000000000000000000000000000000

# The OCI resources of the expenses service. `make provision` writes them to .env from the Terraform outputs;
# the test resource sets them after provisioning floci-oci itself.
expenses.storage.namespace=${EXPENSES_STORAGE_NAMESPACE}
expenses.storage.bucket=${EXPENSES_STORAGE_BUCKET}
expenses.jobs.queue-id=${EXPENSES_JOBS_QUEUE_ID}
expenses.jobs.messages-endpoint=${EXPENSES_JOBS_MESSAGES_ENDPOINT}
expenses.keys.key-id=${EXPENSES_KEYS_KEY_ID}
expenses.keys.crypto-endpoint=${EXPENSES_KEYS_CRYPTO_ENDPOINT}

# OCI Database with PostgreSQL. The URL comes from the DB system's connection details, TLS is verified against the
# DB system's own CA certificate, and the password is read from an OCI Vault secret, never from configuration.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${EXPENSES_DATABASE_JDBC_URL}
quarkus.datasource.credentials-provider=oci-vault-secret
quarkus.datasource.credentials-provider-name=oci-vault-secret
expenses.database.username=${EXPENSES_DATABASE_USERNAME}
expenses.database.password-secret-id=${EXPENSES_DATABASE_PASSWORD_SECRET_ID}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Tests redeliver failed jobs quickly instead of waiting a minute.
%test.expenses.jobs.visibility-seconds=1
%test.expenses.jobs.long-poll-seconds=1
%test.expenses.jobs.poll-every=200ms
